<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://*.mzstatic.com; style-src 'self' 'unsafe-inline'; connect-src 'self';"
    />
    <title>Cinnamon Mini</title>
  </head>
  <body class="mini">
    <div class="mini-ambient" id="miniAmbient"></div>
    <div class="mini-scrim"></div>
    <div class="mini-inner">
      <div class="mini-cover" id="miniCover"></div>
      <div class="mini-meta">
        <div class="mini-track" id="miniTrack">Cinnamon</div>
        <div class="mini-artist" id="miniArtist">Nothing playing</div>
        <div class="mini-progress-wrap" id="miniProgressWrap">
          <div class="mini-progress" id="miniProgress"></div>
        </div>
      </div>
      <div class="mini-controls" id="miniControls"></div>
      <button class="mini-close" id="miniClose" title="Hide">
        <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.3" /></svg>
      </button>
    </div>
    <script type="module" src="./src/mini.ts"></script>
  </body>
</html>
